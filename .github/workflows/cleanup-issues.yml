name: 清理调试 Issue

on:
  workflow_dispatch:

permissions:
  issues: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: 关闭 CI 调试日志 issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          for n in 1 2; do
            curl -sS -X PATCH \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GH_REPO/issues/$n" \
              -d '{"state":"closed"}' -o /dev/null -w "issue #$n -> %{http_code}\n" || true
          done
